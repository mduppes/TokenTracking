<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenTracking</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>TokenTracking</h1>
      <p class="sub" id="updated">Loading…</p>
    </div>
    <div class="controls">
      <button id="refreshBtn" type="button" hidden>Refresh now</button>
      <button id="viewToggle" type="button">Table view</button>
    </div>
  </header>
  <div id="notices"></div>
  <div id="upnext"></div>
  <main id="grid"></main>
  <section id="table" hidden></section>
  <div id="tip" role="tooltip" hidden></div>
  <script src="app.js" type="module"></script>
</body>
</html>
